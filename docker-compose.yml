---
x-assignments-build: &assignments-build
    build:
        context: .
        dockerfile: apps/assignments/Dockerfile

x-sso-build: &sso-build
    build:
        context: .
        dockerfile: apps/sso/Dockerfile

x-logging: &default-logging
    driver: "json-file"
    options:
        max-size: "10m"
        max-file: "5"

x-restart-policy: &restart-policy
    restart: unless-stopped

x-security-opts: &security-opts
    security_opt:
        - no-new-privileges:true

services:
    postgres:
        image: postgres:18-alpine
        <<: [*restart-policy, *security-opts]
        env_file:
            - .env
        environment:
            POSTGRES_USER_FILE: /run/secrets/postgres_user
            POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_MULTIPLE_DATABASES: sso_db,assignment_db
        secrets:
            - postgres_user
            - postgres_password
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./libs/database/init/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $$(cat /run/secrets/postgres_user) -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 10s
            retries: 15
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 10G
        logging: *default-logging
        networks:
            - backend

    migrate-sso:
        <<: [*sso-build, *security-opts]
        env_file:
            - apps/sso/.env
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            MIGRATIONS_PATH: /migrations
        entrypoint: ["/bin/migrator"]
        restart: "no"
        depends_on:
            postgres:
                condition: service_healthy
        logging: *default-logging
        networks:
            - backend

    sso-service:
        <<: [*sso-build, *restart-policy, *security-opts]
        env_file:
            - apps/sso/.env
        environment:
            CONFIG_PATH: /app/config/prod.yaml
            DB_HOST: postgres
            DB_PORT: 5432
        entrypoint: ["/bin/sso"]
        read_only: true
        tmpfs:
            - /tmp
        volumes:
            - ./apps/sso/config:/app/config:ro
            - ./apps/sso/keys:/keys:ro
        depends_on:
            migrate-sso:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "/bin/grpc_health_probe", "-addr=:50051"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        logging: *default-logging
        networks:
            - backend

    migrate-assignments:
        <<: [*assignments-build, *security-opts]
        env_file:
            - apps/assignments/.env
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            MIGRATIONS_PATH: /migrations
        entrypoint: ["/bin/migrator"]
        restart: "no"
        depends_on:
            postgres:
                condition: service_healthy
            migrate-sso:
                condition: service_completed_successfully
        logging: *default-logging
        networks:
            - backend

    assignment-service:
        <<: [*assignments-build, *restart-policy, *security-opts]
        env_file:
            - apps/assignments/.env
        environment:
            CONFIG_PATH: /app/config/prod.yaml
            DB_HOST: postgres
            DB_PORT: 5432
            JWT_JWKS_URL: http://sso-service:8080/.well-known/jwks.json
        entrypoint: ["/bin/assignments"]
        read_only: true
        tmpfs:
            - /tmp
        volumes:
            - ./apps/assignments/config:/app/config:ro
        depends_on:
            migrate-assignments:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            sso-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "/bin/grpc_health_probe", "-addr=:50052"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        logging: *default-logging
        networks:
            - backend

    gateway-service:
        <<: [*restart-policy, *security-opts]
        build:
            context: .
            dockerfile: apps/gateway/Dockerfile
        env_file:
            - apps/gateway/.env
        environment:
            CONFIG_PATH: /app/config/prod.yaml
            ASSIGNMENT_SERVICE_ADDR: assignment-service:50052
            SSO_SERVICE_ADDR: sso-service:50051
        volumes:
            - ./apps/gateway/config:/app/config:ro
        expose:
            - "8000"
        depends_on:
            assignment-service:
                condition: service_healthy
            sso-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:8000/health",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        logging: *default-logging
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.gateway.rule=Host(`api.${DOMAIN}`)"
            - "traefik.http.routers.gateway.entrypoints=websecure"
            - "traefik.http.routers.gateway.tls.certresolver=le"
            - "traefik.http.services.gateway.loadbalancer.server.port=8000"
        networks:
            - backend
            - frontend

    frontend:
        <<: [*restart-policy, *security-opts]
        build:
            context: ./frontend
            dockerfile: Dockerfile
        env_file:
            - frontend/.env
        expose:
            - "80"
        depends_on:
            gateway-service:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 128M
        logging: *default-logging
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
            - "traefik.http.routers.frontend.entrypoints=websecure"
            - "traefik.http.routers.frontend.tls.certresolver=le"
            - "traefik.http.services.frontend.loadbalancer.server.port=80"
        networks:
            - frontend

    reverse-proxy:
        image: traefik:v3.1
        <<: [*restart-policy, *security-opts]
        env_file: .env
        command:
            - "--providers.docker=true"
            - "--providers.docker.exposedByDefault=false"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
            - "--certificatesresolvers.le.acme.httpchallenge=true"
            - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
            - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - letsencrypt:/letsencrypt
        logging: *default-logging
        networks:
            - frontend

secrets:
    postgres_user:
        file: ./secrets/postgres_user.txt
    postgres_password:
        file: ./secrets/postgres_password.txt

volumes:
    postgres_data:
    letsencrypt:

networks:
    backend:
        driver: bridge
        internal: true
    frontend:
        driver: bridge
