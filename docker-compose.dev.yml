---
x-sso-build-dev: &sso-build-dev
    build:
        context: .
        dockerfile: apps/sso/Dockerfile.dev

x-assignments-build-dev: &assignments-build-dev
    build:
        context: .
        dockerfile: apps/assignments/Dockerfile.dev

x-gateway-build-dev: &gateway-build-dev
    build:
        context: .
        dockerfile: apps/gateway/Dockerfile.dev

x-logging: &default-logging
    driver: "json-file"
    options:
        max-size: "10m"
        max-file: "5"

x-restart-policy: &restart-policy
    restart: unless-stopped

x-security-opts: &security-opts
    security_opt:
        - no-new-privileges:true

services:
    postgres:
        image: postgres:18-alpine
        container_name: postgres-dev
        <<: [*restart-policy, *security-opts]
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_MULTIPLE_DATABASES: sso_db,assignment_db
        volumes:
            - postgres_dev_data:/var/lib/postgresql
            - ./libs/database/init/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
        ports:
            - "5432:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        logging: *default-logging
        networks:
            - backend

    migrate-sso:
        <<: [*sso-build-dev, *security-opts]
        container_name: migrate-sso-dev
        restart: "no"
        env_file:
            - apps/sso/.env
        environment:
            GOPROXY: "https://goproxy.cn,direct"
            DB_HOST: postgres
            DB_PORT: 5432
            MIGRATIONS_PATH: /workspace/apps/sso/migrations
        entrypoint:
            ["sh", "-c", "cd /workspace/apps/sso && go run ./cmd/migrator"]
        volumes:
            - .:/workspace
            - go_mod_cache:/root/go/pkg/mod
            - go_build_cache:/root/.cache/go/build
        depends_on:
            postgres:
                condition: service_healthy
        logging: *default-logging
        networks:
            - backend

    sso-service:
        <<: [*sso-build-dev, *restart-policy, *security-opts]
        container_name: sso-service-dev
        profiles: ["sso", "assignments", "gateway", "frontend", "full"]
        env_file:
            - apps/sso/.env
        environment:
            GOPROXY: "https://goproxy.cn,direct"
            CONFIG_PATH: /app/config/local.yaml
            DB_HOST: postgres
            DB_PORT: 5432
        volumes:
            - .:/workspace
            - ./apps/sso:/app/src
            - ./apps/sso/config:/app/config:ro
            - ./apps/sso/keys:/keys:ro
            - go_mod_cache:/root/go/pkg/mod
            - go_build_cache:/root/.cache/go/build
        ports:
            - "50051:50051"
            - "2346:2346"
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
            migrate-sso:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD-SHELL", "nc -z localhost 50051"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s
        logging: *default-logging
        networks:
            - backend
            - frontend

    migrate-assignments:
        <<: [*assignments-build-dev, *security-opts]
        container_name: migrate-assignments-dev
        restart: "no"
        env_file:
            - apps/assignments/.env
        environment:
            GOPROXY: "https://goproxy.cn,direct"
            DB_HOST: postgres
            DB_PORT: 5432
            MIGRATIONS_PATH: /workspace/apps/assignments/migrations
        entrypoint:
            [
                "sh",
                "-c",
                "cd /workspace/apps/assignments && go run ./cmd/migrator",
            ]
        volumes:
            - .:/workspace
            - go_mod_cache:/root/go/pkg/mod
            - go_build_cache:/root/.cache/go/build
        depends_on:
            postgres:
                condition: service_healthy
            migrate-sso:
                condition: service_completed_successfully
        logging: *default-logging
        networks:
            - backend

    assignment-service:
        <<: [*assignments-build-dev, *restart-policy, *security-opts]
        container_name: assignment-service-dev
        profiles: ["assignments", "gateway", "frontend", "full"]
        env_file:
            - apps/assignments/.env
        environment:
            GOPROXY: "https://goproxy.cn,direct"
            CONFIG_PATH: /app/config/local.yaml
            DB_HOST: postgres
            DB_PORT: 5432
            JWT_JWKS_URL: http://sso-service:8080/.well-known/jwks.json
        volumes:
            - .:/workspace
            - ./apps/assignments:/app/src
            - ./apps/assignments/config:/app/config:ro
            - go_mod_cache:/root/go/pkg/mod
            - go_build_cache:/root/.cache/go/build
        ports:
            - "50052:50052"
            - "2345:2345"
        depends_on:
            postgres:
                condition: service_healthy
            sso-service:
                condition: service_healthy
            migrate-assignments:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD-SHELL", "nc -z localhost 50052"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s
        logging: *default-logging
        networks:
            - backend

    gateway-service:
        <<: [*gateway-build-dev, *restart-policy, *security-opts]
        container_name: gateway-service-dev
        profiles: ["gateway", "frontend", "full"]
        env_file:
            - apps/gateway/.env
        environment:
            CONFIG_PATH: /app/config/local.yaml
            ASSIGNMENT_SERVICE_ADDR: assignment-service:50052
            SSO_SERVICE_ADDR: sso-service:50051
        volumes:
            - .:/workspace
            - ./apps/gateway:/app/src
            - ./apps/gateway/config:/app/config:ro
            - go_mod_cache:/root/go/pkg/mod
            - go_build_cache:/root/.cache/go/build
        ports:
            - "8000:8000"
            - "2347:2347"
        depends_on:
            sso-service:
                condition: service_healthy
            assignment-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:8000/health",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s
        logging: *default-logging
        networks:
            - backend
            - frontend

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        container_name: frontend-dev
        profiles: ["frontend", "full"]
        <<: [*restart-policy, *security-opts]
        env_file:
            - frontend/.env
        volumes:
            - ./frontend:/app
            - node_modules:/app/node_modules
        ports:
            - "3000:3000"
        depends_on:
            gateway-service:
                condition: service_healthy
        logging: *default-logging
        networks:
            - frontend

volumes:
    postgres_dev_data:
    go_mod_cache:
    go_build_cache:
    node_modules:

networks:
    backend:
        driver: bridge
    frontend:
        driver: bridge
