version: v1
managed:
    enabled: true
    go_package_prefix:
        default: github.com/Kaptoshka/creative-learning-platform/libs/protos/gen/go
        except:
            - buf.build/googleapis/googleapis
plugins:
    - plugin: go
      out: libs/protos/gen/go
      opt: paths=source_relative

    - plugin: go-grpc
      out: libs/protos/gen/go
      opt: paths=source_relative
