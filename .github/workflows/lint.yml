---
name: Lint

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

concurrency:
    group: lint-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            go: ${{ steps.filter.outputs.go }}
            nix: ${{ steps.filter.outputs.nix }}
            yaml: ${{ steps.filter.outputs.yaml }}
            protos: ${{ steps.filter.outputs.protos }}
            docker: ${{ steps.filter.outputs.docker }}
            compose: ${{ steps.filter.outputs.compose }}
        steps:
            - uses: actions/checkout@v6

            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      go:
                          - '**/*.go'
                      nix:
                          - '**/*.nix'
                      yaml:
                          - '**/*.yaml'
                          - '**/*.yml'
                      protos:
                          - '**/*.proto'
                      docker:
                          - '**/Dockerfile*'
                      compose:
                          - 'docker-compose*.yml'

    lint-go:
        name: Lint Go files
        needs: changes
        if: ${{ needs.changes.outputs.go == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
            - name: golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.10
                  args: --config=.golangci.yml

    lint-nix:
        name: Nix
        needs: changes
        if: ${{ needs.changes.outputs.nix == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: DeterminateSystems/nix-installer-action@v14

            - name: nixpkgs-fmt -- format
              run: nix run nixpkgs#nixpkgs-fmt -- --check .

            - name: statix -- static analysis
              run: nix run nixpkgs#statix -- check .

            - name: deadnix -- search for unused code
              run: nix run nixpkgs#deadnix -- --fail .

    lint-yaml:
        name: YAML
        needs: changes
        if: ${{ needs.changes.outputs.yaml == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: yamllint
              uses: ibiqlik/action-yamllint@v3
              with:
                  config-file: .yamllint.yml
                  file-or-dir: .
                  strict: false

    lint-protos:
        name: Buf
        needs: changes
        if: ${{ needs.changes.outputs.protos == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: bufbuild/buf-setup-action@v1.50.0
            - uses: bufbuild/buf-lint-action@v1.1.1
              with:
                  input: "libs/protos"

    lint-dockerfile:
        name: Dockerfile (hadoling)
        needs: changes
        if: ${{ needs.changes.outputs.docker == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Run hadolint
              uses: hadolint/hadolint-action@v3.1.0
              with:
                  config: .hadolint.yml
                  recursive: true
                  dockerfile: ${{ steps.files.outputs.files }}

    lint-compose:
        name: docker-compose
        needs: changes
        if: ${{ needs.changes.outputs.compose == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Validate docker-compose.yml
              run: docker compose -f docker-compose.yml config

            - name: Validate docker-compose.dev.yml
              run: docker compose -f docker-compose.dev.yml config
